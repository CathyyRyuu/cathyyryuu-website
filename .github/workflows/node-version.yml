# Dependabot does not touch .nvmrc or package.json "engines", so this checks
# monthly for a newer Node.js LTS major and opens a PR that bumps the runtime.
name: Node.js LTS check

on:
  schedule:
    - cron: "0 13 1 * *" # 1st of each month, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare .nvmrc with latest LTS
        id: lts
        run: |
          current=$(tr -d 'v \n' < .nvmrc | cut -d. -f1)
          latest=$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r '[.[] | select(.lts != false)][0].version' \
            | sed 's/^v//' | cut -d. -f1)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" -gt "$current" ]; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            echo "Node $current is behind the latest LTS ($latest)"
          else
            echo "Node $current is the latest LTS"
          fi

      - uses: actions/setup-node@v7
        if: steps.lts.outputs.outdated == 'true'
        with:
          node-version: ${{ steps.lts.outputs.latest }}

      - name: Bump Node version
        if: steps.lts.outputs.outdated == 'true'
        env:
          LATEST: ${{ steps.lts.outputs.latest }}
        run: |
          echo "$LATEST" > .nvmrc
          npm pkg set engines.node="${LATEST}.x"
          npm install --save-dev "@types/node@^${LATEST}"

      - uses: peter-evans/create-pull-request@v8
        if: steps.lts.outputs.outdated == 'true'
        with:
          # PRs opened with GITHUB_TOKEN don't trigger CI. Add a fine-grained
          # PAT as the AUTOMATION_TOKEN secret to have CI run on this PR.
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          branch: deps/node-${{ steps.lts.outputs.latest }}
          base: main
          commit-message: "deps: upgrade Node.js ${{ steps.lts.outputs.current }} -> ${{ steps.lts.outputs.latest }} (LTS)"
          title: "deps: upgrade Node.js to ${{ steps.lts.outputs.latest }} LTS"
          labels: dependencies
          body: |
            Node.js ${{ steps.lts.outputs.latest }} is now the latest LTS; this repo is on ${{ steps.lts.outputs.current }}.

            Changes:
            - `.nvmrc` -> `${{ steps.lts.outputs.latest }}`
            - `package.json` `engines.node` -> `${{ steps.lts.outputs.latest }}.x`
            - `@types/node` -> `^${{ steps.lts.outputs.latest }}`

            Before merging, check that Vercel supports Node ${{ steps.lts.outputs.latest }}
            (Project Settings -> General -> Node.js Version), otherwise the deploy will fail.

            Opened automatically by `.github/workflows/node-version.yml`.
