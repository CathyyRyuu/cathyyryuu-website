# Lints and builds every PR (including the automated dependency PRs) so a
# breaking upgrade shows up as a red check before it is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Audit production dependencies
        # Reports in the job log without blocking; Dependabot opens the fixes.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
